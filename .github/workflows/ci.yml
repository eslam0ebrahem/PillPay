name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          JWT_SECRET: ci-test-jwt-secret-at-least-32-chars!!
          JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars!!

      - name: Build
        run: npm run build
        env:
          JWT_SECRET: ci-test-jwt-secret-at-least-32-chars!!
          JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars!!
          MONGODB_URI: mongodb://localhost:27017/pillpay_test
