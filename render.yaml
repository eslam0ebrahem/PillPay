services:
  - type: web
    name: pillpay
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "24h"
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: SEED_OWNER_EMAIL
        sync: false
      - key: SEED_OWNER_PASSWORD
        sync: false
      - key: SEED_OWNER_NAME
        sync: false
      - key: NEXT_PUBLIC_APP_NAME
        value: PillPay
